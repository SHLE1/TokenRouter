name: Verification cache
description: 恢复当前工具链和任务的编译缓存，并返回本轮保存键。
inputs:
  variant:
    description: 测试标签或检查名称
    required: true
outputs:
  paths:
    description: Go 模块、编译和 lint 缓存目录
    value: ${{ steps.identity.outputs.paths }}
  key:
    description: 当前运行的缓存保存键
    value: ${{ steps.identity.outputs.key }}
runs:
  using: composite
  steps:
    - name: Identify cache
      id: identity
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
        DEPENDENCIES: ${{ hashFiles('backend/go.sum', 'backend/go.mod', 'tools/architecture/go.sum', 'tools/architecture/go.mod', 'backend/.golangci.yml', '.golangci-version', '.github/actions/verification-cache/action.yml') }}
      run: |
        prefix="verification-v1-${RUNNER_OS}-${RUNNER_ARCH}-$(go env GOVERSION)-$(cat .golangci-version)-${VARIANT}-${DEPENDENCIES}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
        {
          echo 'paths<<CACHE_PATHS'
          go env GOMODCACHE
          go env GOCACHE
          echo "$HOME/.cache/golangci-lint"
          echo CACHE_PATHS
        } >> "$GITHUB_OUTPUT"
    - name: Restore compatible cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.identity.outputs.paths }}
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.prefix }}
